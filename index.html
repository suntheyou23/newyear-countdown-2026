<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年カウントダウン 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 雪のパーティクルコンテナ -->
    <div id="snow-container"></div>

    <!-- カウントダウン画面 -->
    <div id="countdown-screen" class="screen active">
        <div class="content">
            <h1 class="title">新年まであと</h1>
            <div class="countdown-display">
                <div class="time-unit">
                    <span class="number" id="days">00</span>
                    <span class="label">日</span>
                </div>
                <div class="time-unit">
                    <span class="number" id="hours">00</span>
                    <span class="label">時間</span>
                </div>
                <div class="time-unit">
                    <span class="number" id="minutes">00</span>
                    <span class="label">分</span>
                </div>
                <div class="time-unit">
                    <span class="number" id="seconds">00</span>
                    <span class="label">秒</span>
                </div>
            </div>
            <p class="year-label">2026年まで</p>
        </div>
    </div>

    <!-- 新年画面 -->
    <div id="newyear-screen" class="screen">
        <div class="content">
            <h1 class="newyear-title">
                <span class="newyear-line">あけまして</span>
                <span class="newyear-line">おめでとう</span>
                <span class="newyear-line">ございます</span>
            </h1>
            <p class="year-label-large">2026</p>
            <button id="omikuji-btn" class="omikuji-button">
                <span>おみくじを引く</span>
            </button>
        </div>
    </div>

    <!-- おみくじ結果画面 -->
    <div id="omikuji-screen" class="screen">
        <div class="omikuji-scroll">
            <div class="scroll-top"></div>
            <div class="scroll-content">
                <h2 class="omikuji-title">おみくじ</h2>
                <div class="fortune-result" id="fortune-result"></div>
                <div class="fortune-message" id="fortune-message"></div>
                <div class="fortune-details">
                    <div class="fortune-item">
                        <span class="fortune-label">健康運</span>
                        <span class="fortune-value" id="health"></span>
                    </div>
                    <div class="fortune-item">
                        <span class="fortune-label">仕事運</span>
                        <span class="fortune-value" id="work"></span>
                    </div>
                    <div class="fortune-item">
                        <span class="fortune-label">恋愛運</span>
                        <span class="fortune-value" id="love"></span>
                    </div>
                    <div class="fortune-item">
                        <span class="fortune-label">金運</span>
                        <span class="fortune-value" id="money"></span>
                    </div>
                </div>
            </div>
            <div class="scroll-bottom"></div>
        </div>
        <button id="retry-btn" class="retry-button">もう一度引く</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
